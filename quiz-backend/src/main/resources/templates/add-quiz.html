<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Quiz - Learn & Quiz</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="app">

  <header class="top-bar">
    <div class="top-left">
      <div class="welcome-title">Create New Quiz</div>
    </div>
    <div class="top-right">
      <a th:href="@{'/?userEmail=' + ${userEmail}}" class="btn-secondary">Back to Dashboard</a>
    </div>
  </header>

  <main class="content" style="grid-template-columns: minmax(0, 1fr);">
    <section class="section-block">
      <div class="subject-card">
        <form th:action="@{'/quiz/new?userEmail=' + ${userEmail}}" method="post" class="quiz-form" id="quizBuilder">
          <div class="form-group">
            <label>Subject (quiz name)</label>
            <input type="text" name="subject" list="subject-list"
                   placeholder="e.g. Data Structures" required>
            <datalist id="subject-list">
              <option th:each="s : ${existingSubjects}" th:value="${s}">s</option>
            </datalist>
          </div>

          <div class="form-group">
            <label>Category</label>
            <input type="text" name="category" list="category-list"
                   placeholder="e.g. Programming, Business, Humanities">
            <datalist id="category-list">
              <option th:each="c : ${existingCategories}" th:value="${c}">c</option>
            </datalist>
          </div>

          <div id="questions-container">
            <div class="question-block">
              <div class="form-group">
                <label>Question 1</label>
                <textarea name="questionTexts" rows="3" placeholder="Type your question here" required></textarea>
              </div>

              <div class="form-group">
                <label>Options</label>
                <input type="text" name="option1s" placeholder="Option 1" required>
                <input type="text" name="option2s" placeholder="Option 2" required>
                <input type="text" name="option3s" placeholder="Option 3" required>
                <input type="text" name="option4s" placeholder="Option 4" required>
              </div>

              <div class="form-group">
                <label>Correct option (1-4)</label>
                <input type="number" name="correctOptions" min="1" max="4" value="1" required>
              </div>
              <hr>
            </div>
          </div>

          <button type="button" class="btn-secondary" id="addQuestionBtn">+ Add another question</button>
          <button type="submit" class="btn-primary">Save quiz</button>
        </form>
      </div>
    </section>
  </main>
</div>

<script>
  (function () {
    const container = document.getElementById('questions-container');
    const addBtn = document.getElementById('addQuestionBtn');

    function updateLabels() {
      const blocks = container.querySelectorAll('.question-block');
      blocks.forEach((block, idx) => {
        const label = block.querySelector('label');
        if (label) label.textContent = `Question ${idx + 1}`;
      });
    }

    function addQuestion() {
      const first = container.querySelector('.question-block');
      const clone = first.cloneNode(true);
      clone.querySelectorAll('textarea, input').forEach((el) => {
        el.value = '';
      });
      container.appendChild(clone);
      updateLabels();
    }

    addBtn.addEventListener('click', addQuestion);
    updateLabels();
  })();
</script>
</body>
</html>
