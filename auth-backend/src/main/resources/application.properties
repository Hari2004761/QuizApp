# ===============================
# H2 DATABASE CONFIGURATION
# Use dedicated auth DB file so auth and quiz services don't fight for locks.
# Console password is blank for local development.
# ===============================
spring.datasource.url=jdbc:h2:file:../data/authdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
server.port=8080


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# H2 CONSOLE (optional)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
